<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Dawn of Elioria</title>
  <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; background: #080b18; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body { color: #f6e8cc; font: 17px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: 0; }
    main { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
      justify-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); text-align: center; }
    main[hidden] { display: none; }
    h1 { font: normal clamp(28px, 6vw, 48px) Georgia, serif; margin: 0; }
    progress { width: min(300px, 72vw); accent-color: #e5ab70; }
    #status { max-width: 460px; margin: 0; }
    #fs-btn {
      position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 5; background: #141c33d8; color: #f6e8cc; border: 1px solid #e5ab7088; border-radius: 999px;
      padding: 8px 14px; font-size: 14px; cursor: pointer; display: none;
    }
    dialog { box-sizing: border-box; width: min(500px, 92vw); background: #0d1224; color: inherit;
      border: 1px solid #a4764b; padding: clamp(20px, 4.5vw, 38px); border-radius: 10px; }
    dialog::backdrop { background: #060812cc; }
    dialog h2 { font: normal clamp(24px, 4.5vw, 38px) Georgia, serif; margin: 0 0 18px; }
    dialog label { display: block; margin-bottom: 8px; }
    dialog input { box-sizing: border-box; width: 100%; color: inherit; background: #18203a; border: 1px solid #58627a;
      font-size: 20px; padding: 12px 14px; border-radius: 6px; -webkit-user-select: text; user-select: text; }
    #room-code { font-size: 22px; text-transform: uppercase; letter-spacing: .18em; }
    dialog menu { display: flex; gap: 12px; padding: 0; margin: 20px 0 0; }
    dialog button { color: inherit; background: #28314c; border: 0; padding: 12px 18px; font: inherit; cursor: pointer; border-radius: 6px; }
    dialog button[type=submit] { background: #7e5633; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Там, где начинается рассвет"></canvas>
  <button id="fs-btn" type="button" aria-label="На весь экран">⛶ Экран</button>
  <main id="loading">
    <h1>Там, где начинается рассвет</h1>
    <progress id="progress" max="1" value="0" aria-label="Прогресс загрузки"></progress>
    <p id="status" role="status">Загружаем долину…</p>
  </main>
  <dialog id="room-dialog" aria-labelledby="room-dialog-title">
    <form id="room-form">
      <h2 id="room-dialog-title">Найти спутника</h2>
      <label for="room-code">Шестизначный код комнаты</label>
      <input id="room-code" name="room-code" required minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}"
        autocapitalize="characters" spellcheck="false" autocomplete="off">
      <menu>
        <button type="submit">Присоединиться</button>
        <button id="cancel-room" type="button">Назад</button>
      </menu>
    </form>
  </dialog>
  <dialog id="chat-dialog" aria-labelledby="chat-dialog-title">
    <form id="chat-form">
      <h2 id="chat-dialog-title">Сообщение спутнику</h2>
      <label for="chat-text">Напишите сообщение спутнику</label>
      <input id="chat-text" name="chat-text" maxlength="120" autocomplete="off" placeholder="Напишите сообщение…">
      <menu>
        <button type="submit">Отправить</button>
        <button id="cancel-chat" type="button">Отмена</button>
      </menu>
    </form>
  </dialog>
  <dialog id="name-dialog" aria-labelledby="name-dialog-title">
    <form id="name-form">
      <h2 id="name-dialog-title">Имя для спутника</h2>
      <label for="partner-name">Как вы назовёте своего друга? Это имя отобразится у него в игре.</label>
      <input id="partner-name" name="partner-name" required minlength="1" maxlength="20" autocomplete="off" placeholder="Например: Солнышко">
      <menu>
        <button type="submit">Сохранить</button>
        <button id="cancel-name" type="button">Отмена</button>
      </menu>
    </form>
  </dialog>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const dialog = document.querySelector("#room-dialog");
    const roomCode = document.querySelector("#room-code");
    const roomForm = document.querySelector("#room-form");
    const chatDialog = document.querySelector("#chat-dialog");
    const chatInput = document.querySelector("#chat-text");
    const chatForm = document.querySelector("#chat-form");
    const nameDialog = document.querySelector("#name-dialog");
    const nameInput = document.querySelector("#partner-name");
    const nameForm = document.querySelector("#name-form");
    const fsBtn = document.querySelector("#fs-btn");
    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    const canFs = !!document.documentElement.requestFullscreen;
    let allowFsBtn = true;

    function refreshFsBtn() {
      const show = canFs && isTouch && allowFsBtn && !document.fullscreenElement;
      fsBtn.style.display = show ? "block" : "none";
    }
    window.elioriaSetFullscreenButtonVisible = visible => {
      allowFsBtn = !!visible;
      refreshFsBtn();
    };
    if (canFs && isTouch) {
      refreshFsBtn();
      document.addEventListener("fullscreenchange", refreshFsBtn);
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      });
    }

    function sendGame(method, value = "") {
      window.elioria?.SendMessage("Dawn of Elioria", method, value);
    }
    window.elioriaOpenRoomDialog = () => {
      if (!dialog.open) dialog.showModal();
      roomCode.focus();
    };
    dialog.addEventListener("close", () => {
      sendGame("RestoreBrowserKeyboard");
      canvas.focus();
    });
    document.querySelector("#cancel-room").addEventListener("click", () => dialog.close());
    roomForm.addEventListener("submit", event => {
      event.preventDefault();
      const code = roomCode.value.trim().toUpperCase();
      dialog.close();
      sendGame("JoinFromBrowser", code);
    });

    window.elioriaOpenChatDialog = () => {
      chatInput.value = "";
      if (!chatDialog.open) chatDialog.showModal();
      setTimeout(() => chatInput.focus(), 40);
    };
    chatDialog.addEventListener("close", () => {
      sendGame("RestoreBrowserKeyboard");
      canvas.focus();
    });
    document.querySelector("#cancel-chat").addEventListener("click", () => chatDialog.close());
    chatForm.addEventListener("submit", event => {
      event.preventDefault();
      const msg = chatInput.value.trim();
      chatDialog.close();
      if (msg.length > 0) sendGame("SendChatFromBrowser", msg);
    });

    window.elioriaOpenPartnerNameDialog = current => {
      nameInput.value = current || "";
      if (!nameDialog.open) nameDialog.showModal();
      setTimeout(() => nameInput.focus(), 40);
    };
    nameDialog.addEventListener("close", () => {
      sendGame("RestoreBrowserKeyboard");
      canvas.focus();
    });
    document.querySelector("#cancel-name").addEventListener("click", () => nameDialog.close());
    nameForm.addEventListener("submit", event => {
      event.preventDefault();
      const nick = nameInput.value.trim();
      nameDialog.close();
      if (nick.length > 0) sendGame("SetPartnerNameFromBrowser", nick);
    });

    const useFastCdn = location.hostname.endsWith("github.io");
    const sources = useFastCdn
      ? ["https://gcore.jsdelivr.net/gh/Streavzf/dawn-of-elioria-web@9c5aa9dac0/Build/", "Build/"]
      : ["Build/"];
    let sourceIdx = 0;

    function failed(error) {
      console.error(error);
      if (sourceIdx + 1 < sources.length) {
        sourceIdx++;
        status.textContent = "Переключаемся на резервный канал…";
        bootFrom(sources[sourceIdx]);
        return;
      }
      progress.hidden = true;
      status.textContent = "Не удалось открыть игру. Обновите страницу и проверьте поддержку WebGL 2.";
    }

    function bootFrom(build) {
      const script = document.createElement("script");
      script.src = build + "59085928fdd813a791e96e657bfdf714.loader.js";
      script.onerror = failed;
      script.onload = () => createUnityInstance(canvas, {
        dataUrl: build + "237af001acc6ee27ba8f29c568604394.data.unityweb",
        frameworkUrl: build + "2f5fe51314f6cc4739f4a2a1c56fdaa2.framework.js.unityweb",
        codeUrl: build + "1393cb185612be9fa2b8f87d61367cc9.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Elioria",
        productName: "Dawn of Elioria",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isTouch ? 1.35 : 1.5)
      }, value => {
        progress.value = value;
        const pct = Math.min(99, Math.round(value * 100));
        status.textContent = value < .9 ? `Загружаем долину… ${pct}%` : "Запускаем мир…";
      }).then(instance => {
        window.elioria = instance;
        loading.hidden = true;
        if (isTouch) sendGame("EnableTouchControls", "1");
      }, failed);
      document.body.append(script);
    }
    bootFrom(sources[0]);
  </script>
</body>
</html>
